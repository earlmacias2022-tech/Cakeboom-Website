<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/homepage.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CAKEBOOM</title>
  </head>
  <body>
    <header>
      <div class="header-wrapper">
        <div class="header-container">
          <div>
            <img
              class="logo"
              src="/assets/images/cakeboom-logo.png"
              alt="CakeBoom Logo"
            />
          </div>
          <div>
            <nav>
              <a href="#home">Home</a>
              <a href="#cakes">Our Cakes</a>
              <a href="#bestsellers">Best Seller</a>
              <a href="#about">About Us</a>
              <a href="#contact">Contact</a>
            </nav>
          </div>
          <div>
            <button class="head-btn">Order Now</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <div class="hero-container">
          <div class="hero-cards">
            <div class="hero-discription-container">
              <div>
                <p class="para">
                  FRESHLY BAKED
                  <span style="font-weight: bold">&#183;</span> ALWAYS DELICOUS
                </p>
                <h1 class="hero-main-text">
                  Make Every <br />
                  Moment <br />
                  <span style="color: #c4162a"> Sweeter.</span>
                </h1>
                <p style="width: 70%; font-size: 17px">
                  Freshly made cakes for your celebrations and everyday moments.
                  Because life is better with cake.
                </p>
              </div>

              <div class="hero-buttons">
                <button class="explore-btn">Explore Our Cakes →</button>
                <button class="order-btn">Order Now</button>
              </div>
            </div>
          </div>
          <div class="hero-cards">
            <img
              class="hero-pic"
              src="/assets/images/Cakeboom-hero.png"
              alt="Cakeboom Cake"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
